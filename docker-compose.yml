version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: securerag-postgres
    environment:
      POSTGRES_DB: securerag_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secure_dev_password_123!
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d securerag_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  openfga:
    image: openfga/openfga:v1.8.3
    container_name: securerag-openfga
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://postgres:secure_dev_password_123!@postgres:5432/securerag_db?sslmode=disable
    command: run
    ports:
      - "8080:8080" # HTTP API
      - "8081:8081" # gRPC API
      - "3000:3000" # Playground UI
    healthcheck:
      test: ["CMD", "/usr/local/bin/openfga", "healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: securerag-redis
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
